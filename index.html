<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#EBEEE6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>FinLock</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ── Pantalla: Desbloquear ──────────────────────────────────────────────── -->
  <div id="screen-unlock" class="screen">
    <div class="unlock-wrap">
      <div class="unlock-logo">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span class="unlock-brand">FinLock</span>
      </div>

      <button id="btn-google" class="btn-primary btn-google">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Conectar con Google Drive
      </button>

      <div id="file-selector" class="hidden">
        <label class="field-label">Archivo</label>
        <select id="file-select" class="field-input"></select>
      </div>

      <div id="password-section" class="hidden">
        <label class="field-label" for="input-password">Contraseña</label>
        <input type="password" id="input-password" class="field-input"
               placeholder="Contraseña de FinLock" autocomplete="current-password">
        <button id="btn-unlock" class="btn-primary">Abrir</button>
      </div>

      <p id="status-msg" class="status-msg hidden"></p>
    </div>
  </div>

  <!-- ── App principal: pestañas ────────────────────────────────────────────── -->
  <div id="screen-app" class="screen">

    <div class="tab-container">

      <!-- ── PESTAÑA: INICIO ───────────────────────────────────────────────── -->
      <div id="tab-inicio" class="tab-panel">
        <header class="app-header">
          <span class="app-title">FinLock</span>
          <button id="btn-cerrar" class="btn-icon" title="Cerrar sesión">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </header>
        <div class="tab-scroll" id="inicio-scroll">
          <div class="networth-card">
            <span class="networth-label">Patrimonio neto</span>
            <span id="networth-value" class="networth-value">—</span>
          </div>
          <div id="inicio-stats" class="stats-row"></div>
          <div id="inicio-dashboard"></div>
          <div id="inicio-planificados"></div>
        </div>
      </div>

      <!-- ── PESTAÑA: CUENTAS ──────────────────────────────────────────────── -->
      <div id="tab-cuentas" class="tab-panel">
        <header class="app-header">
          <span class="app-title">Cuentas</span>
        </header>
        <div id="accounts-list" class="tab-scroll"></div>
      </div>

      <!-- ── PESTAÑA: PRESUPUESTO ──────────────────────────────────────────── -->
      <div id="tab-presupuesto" class="tab-panel">
        <header class="app-header">
          <span class="app-title">Presupuesto</span>
        </header>
        <div class="mes-nav">
          <button id="btn-presu-prev" class="btn-mes">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span id="presu-mes-label" class="mes-nav-label">—</span>
          <button id="btn-presu-next" class="btn-mes">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <div id="presu-list" class="tab-scroll"></div>
      </div>

      <!-- ── PESTAÑA: INFORMES ─────────────────────────────────────────────── -->
      <div id="tab-informes" class="tab-panel">
        <header class="app-header">
          <span class="app-title">Informes</span>
        </header>
        <div id="inf-periodo-filters" class="tx-filters tx-filters--periodo">
          <button class="chip is-active" data-inf-periodo="mes">Este mes</button>
          <button class="chip" data-inf-periodo="mesant">Mes ant.</button>
          <button class="chip" data-inf-periodo="trim">Trimestre</button>
          <button class="chip" data-inf-periodo="anio">Este año</button>
        </div>
        <div class="inf-tabs">
          <button class="inf-tab active" data-inf-tab="gastos">Gastos</button>
          <button class="inf-tab" data-inf-tab="ingresos">Ingresos</button>
          <button class="inf-tab" data-inf-tab="pagadores">Pagadores</button>
          <button class="inf-tab" data-inf-tab="patrimonio">Patrimonio</button>
        </div>
        <div id="inf-content" class="tab-scroll"></div>
      </div>

      <!-- ── PESTAÑA: AGENDA ───────────────────────────────────────────────── -->
      <div id="tab-agenda" class="tab-panel">
        <header class="app-header">
          <span class="app-title">Agenda</span>
        </header>
        <div id="agenda-list" class="tab-scroll"></div>
      </div>

    </div><!-- /tab-container -->

    <!-- ── Navegación inferior ──────────────────────────────────────────────── -->
    <nav class="bottom-nav">
      <button class="bnav-btn active" data-tab="inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Inicio</span>
      </button>
      <button class="bnav-btn" data-tab="cuentas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="1" y="4" width="22" height="16" rx="2"/>
          <line x1="1" y1="10" x2="23" y2="10"/>
        </svg>
        <span>Cuentas</span>
      </button>
      <button class="bnav-btn" data-tab="presupuesto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21.21 15.89A10 10 0 118 2.83"/>
          <path d="M22 12A10 10 0 0012 2v10z"/>
        </svg>
        <span>Presupuesto</span>
      </button>
      <button class="bnav-btn" data-tab="informes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
          <line x1="2" y1="20" x2="22" y2="20"/>
        </svg>
        <span>Informes</span>
      </button>
      <button class="bnav-btn" data-tab="agenda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>Agenda</span>
      </button>
    </nav>

  </div><!-- /screen-app -->

  <!-- ── Pantalla: Cuenta (overlay) ────────────────────────────────────────── -->
  <div id="screen-cuenta" class="screen">
    <header class="app-header app-header--cuenta">
      <button id="btn-back" class="btn-icon btn-back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="cuenta-header-info">
        <span id="screen-cuenta-nombre" class="cuenta-header-nombre"></span>
        <span id="screen-cuenta-saldo"  class="cuenta-saldo-header"></span>
      </div>
    </header>

    <div class="resumen-mes">
      <div class="resumen-item">
        <span class="resumen-label">Ingresos</span>
        <span id="resumen-ingresos" class="resumen-valor pos">—</span>
      </div>
      <div class="resumen-sep"></div>
      <div class="resumen-item resumen-item--center">
        <span id="resumen-num" class="resumen-num">—</span>
      </div>
      <div class="resumen-sep"></div>
      <div class="resumen-item resumen-item--right">
        <span class="resumen-label">Gastos</span>
        <span id="resumen-gastos" class="resumen-valor neg">—</span>
      </div>
    </div>

    <div id="periodo-filters" class="tx-filters tx-filters--periodo">
      <button class="chip is-active" data-periodo="mes">Este mes</button>
      <button class="chip" data-periodo="trim">Trimestre</button>
      <button class="chip" data-periodo="anio">Año</button>
      <button class="chip" data-periodo="todo">Todo</button>
    </div>
    <div id="tx-filters" class="tx-filters">
      <button class="chip is-active" data-signo="">Todos</button>
      <button class="chip" data-signo="gasto">Gastos</button>
      <button class="chip" data-signo="ingreso">Ingresos</button>
    </div>

    <div id="tx-list" class="tx-list"></div>
  </div>

  <!-- Scripts externos (globals antes que los módulos) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

  <!-- Módulos de la app -->
  <script src="js/config.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/queries.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
